# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 -- 2-PATH SS2D (control)
# ------------------------------------------------------------
# jit-s2-vmamba-baseline.yaml with SS2D scanning only its two FORWARD paths
# (scan_paths [0, 2]: row-major and column-major, both from cell (0,0) to
# (H-1, W-1)); the reversed paths 1 / 3 and their per-direction parameters
# (x_proj, dt_proj, A_logs, Ds) are gone. The control for
# jit-s2-vmamba-2path-auxswap: same model, no aux tokens.
# 30,128,448 params (baseline 31,031,616 - 2 paths x 37,632 x 12 blocks),
# about 1.290 GMACs (baseline 1.423).
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-2path
  model: vmamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 2                              # = len(scan_paths)
  scan_paths: [0, 2]                # forward paths only (row-major, column-major)
  # -- conditioning arms: all OFF (adaLN-Zero baseline scaffold) --
  in_context_len: 0                 # in-context prefix OFF
  state_init: none                  # state-init OFF
  ssc: none                         # SSC OFF
  adaln_cond: full                  # adaLN-Zero on both branches (baseline)
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-2path
