# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 — OPTION A, layout=row, content=time_class
# ------------------------------------------------------------
# ROW/COLUMN-DISTRIBUTED in-context conditioning: the SAME tokens as the prefix
# arms, placed at the head of EVERY row instead of stacked at the head of the
# sequence. One DiM [t,y] unit (K=2, the content of the 89.25 prefix arm) leads
# every row for scan directions 0/1 and every column for directions 2/3 — a
# single interleave at stride W covers both, because cross_scan flattens
# row-major for 0/1 and column-major for 2/3.
#
#   in_context_len = 2 * grid_size = 2 * 8 = 16  ([t,y] per row; asserted)
#   scan length L  = 64 + 16 = 80   (+25% vs baseline)
#
# WHY THIS ARM. The measured conditioning routes split along two axes: whether
# the condition acts once or at many positions, and whether it passes through
# the selective Delta/B/C or bypasses them.
#
#                       acts ONCE at scan start | acts at MANY positions
#   through selectivity   prefix   88.92 (-2.81)|  THIS ARM
#   bypassing selectivity stateinit 92.19 (+0.46)| ssc  94.37 (+2.64)
#
# The empty cell is the one the report's conclusion ("conditioning helps when it
# passes through selectivity and hurts when it overrides it") predicts should
# win. Two concrete differences vs the prefix arm:
#   1. Decay. A head-of-scan token's contribution decays as exp(sum Delta*A).
#      Here no image token is more than W=8 scan steps from a condition token,
#      instead of up to 64.
#   2. The prefix NEVER READS THE IMAGE (report sec:prefix): it leads every
#      direction, so by induction over blocks it stays a function of (t,y)
#      alone. Here the unit leading row j reads rows 0..j-1 through the
#      recurrent state, so it becomes a genuine condition-conditioned summary.
#      Verified in tests/test_incontext_row_cpu.py check E.
#
# COST / CONTROL. At 16 tokens this lands on the SAME sequence length as the
# already-measured `class` K=16 PREFIX arm (89.51 FID, 1.656 GMACs, +16.4%), so
# that row is a free length-matched control: row vs prefix at 16 tokens is a
# clean position-only comparison. Added params are only incontext_pos_embed
# (1, 16, 384) — the same negligible count as every prefix arm.
#
# Everything else (recipe, CFG, eval protocol, in_context_start=4) is identical
# to jit-s2-vmamba-incontext-timeclass.yaml so the comparison is controlled.
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-incontext-row-timeclass
  model: vmamba
  dataset: imagenet                 # ImageFolder; works on tiny-imagenet-200/train
  data_dir: ./data/tiny-imagenet-200   # <-- set to your tiny-imagenet-200 path
  seed: 42

model:
  input_size: 64                    # Tiny-IN native res
  patch_size: 8                     # 64/8 = 8x8 = 64 tokens, grid_size = 8
  in_channels: 3
  hidden_size: 384                  # S scale
  depth: 12
  num_heads: 6                      # unused by vmamba, kept for parity
  mlp_ratio: 4.0
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  # SS2D knobs (VMamba: d_conv=3, NOT ViM's 4)
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4                              # number of CrossScan directions (NOT the token count)
  # -- Option A: in-context tokens, distributed one [t,y] unit per row/column --
  in_context_len: 16                # 2 * grid_size; asserted for time_class + row
  in_context_start: 4               # tokens injected from block 4 onward (blocks 0-3 pure grid)
  in_context_content: time_class    # time_class | class
  in_context_layout: row            # prefix | row   <-- the only change vs the prefix arm

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-incontext-row-timeclass
