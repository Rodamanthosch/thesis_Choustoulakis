# ============================================================
# JiT-S2-Spatial-Mamba on Tiny-ImageNet 64x64 -- NO GATE, NO LPU
# ------------------------------------------------------------
# jit-s2-spatial-nogate.yaml (FID 93.95) with the Local Perception Units
# removed (lpu: none); everything else identical. Ablation: VMamba + SASF at
# d_state 1 (4 scans, no LPU) scored 96.24, Spatial no gate (1 scan, LPU)
# 93.95. This run separates the two differences:
#   ~96  -> the LPU is what puts Spatial ahead
#   ~94  -> one scan + SASF really beats four scans + SASF at d_state 1
# The block is then exactly JiTBlock with the Structure-aware SSM as the mixer.
# adaLN-Zero baseline conditioning only (no in-context / state-init / SSC).
#
#   mixer per block (D=384): 330,243  (LPU 7,680 per block removed)
#   model: 29.59M params (29,593,956)
# ============================================================

experiment:
  name: jit-s2-spatial-tinyin-nogate-nolpu
  model: spatial_mamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # Spatial-Mamba (and VMamba-T) setting; required
  d_conv: 3
  expand: 1                         # param-matched to VMamba-T (paper uses 2)
  gate: false                       # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 2, 3]         # SASF on the 8x8 grid; paper [1, 3, 5] for 16x16 (256px)
  lpu: none                         # Local Perception Units before mixer & FFN: none | zero | paper
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-spatial-nogate-nolpu
