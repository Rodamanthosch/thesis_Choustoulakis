# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 — in-context layout=diagonal, content=class
# ------------------------------------------------------------
# 8 class tokens ([y] + a learnable slot each), tied to the grid diagonal:
# token e sits just before cell (e, e) in canonical order and is permuted
# TOGETHER with the image by SS2D's cross-scan (Vim / Mamba-R style): before its
# cell in paths 0/2, after it in the reversed paths 1/3. One token per row AND
# per column, so the tokens are evenly spaced (every 9 steps) in all 4 scans.
#
#   in_context_len = grid_size = 8   (must divide the grid size)
#   scan length L  = 64 + 8 = 72     (+12.5% vs baseline, same as the row arm)
#   tokens live in blocks 4..11      (enter at in_context_start=4, persist to the
#                                     last block, stripped before FinalLayer)
#
# What changes vs the other two 8-token placements (proven per cell in
# tests/test_incontext_diagonal_cpu.py; DWConv aside, per block):
#   prefix   K=8 : every token reads 0 of 64 cells (image-blind), writes to all
#   row          : token j reads [0,28,48,60,64,64,64,64], writes [64,...,60,48,28]
#   diagonal     : every token reads all 64 cells and writes to all 64
#
# Same 8 tokens, same content, same params (state_dict identical to the prefix
# arm), same start block: the three runs differ ONLY in placement.
#   prefix control:  configs/tiny_imagenet/jit-s2-vmamba-incontext-class.yaml
#                    with model.in_context_len=8
#   row:             configs/tiny_imagenet/jit-s2-vmamba-incontext-row-class.yaml
# Sparser variant (no new file): model.in_context_len=4 -> cells (0,0) (2,2)
# (4,4) (6,6), one token every 18 scan steps.
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-incontext-diagonal-class
  model: vmamba
  dataset: imagenet                 # ImageFolder; works on tiny-imagenet-200/train
  data_dir: ./data/tiny-imagenet-200   # <-- set to your tiny-imagenet-200 path
  seed: 42

model:
  input_size: 64                    # Tiny-IN native res
  patch_size: 8                     # 64/8 = 8x8 = 64 tokens, grid_size = 8
  in_channels: 3
  hidden_size: 384                  # S scale
  depth: 12
  num_heads: 6                      # unused by vmamba, kept for parity
  mlp_ratio: 4.0
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  # SS2D knobs (VMamba: d_conv=3, NOT ViM's 4)
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4                              # number of CrossScan directions (NOT the token count)
  # -- in-context class tokens on the grid diagonal, blocks 4..11 --
  in_context_len: 8                 # divides grid_size 8 -> cells (e, e)
  in_context_start: 4               # tokens injected from block 4 onward (blocks 0-3 pure grid)
  in_context_content: class         # diagonal supports class only
  in_context_layout: diagonal       # prefix | row | diagonal   <-- the only change vs the row arm

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-incontext-diagonal-class
