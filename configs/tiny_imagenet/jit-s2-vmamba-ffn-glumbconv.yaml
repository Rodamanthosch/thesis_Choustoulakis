# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 — Mix-FFN / GLUMBConv (SANA)
# ------------------------------------------------------------
# adaLN-Zero baseline scaffold with the token-wise SwiGLU FFN swapped for
# SANA's Mix-FFN (Xie et al., ICLR 2025), exactly as the Sana blocks wire
# GLUMBConv (use_bias=(T, T, F), act=(silu, silu, None)):
#   s      = SiLU(W1 u + b1)             # inverted 1x1, SiLU on BOTH halves
#   s      = DWConv3x3(s)                # all 2h channels, no activation
#   [a, g] = s
#   y      = W3( a * SiLU(g) )           # point 1x1, no bias
# Unlike ConvGLU, the conv acts on the value AND gate halves.
#
# Width param-matched to SwiGLU: h = int(mlp_ratio * D * 2/3) = 1024 instead
# of SANA's int(D * mlp_ratio). +20,096 params/block (+1.7% FFN), +0.24M
# total. DWConv keeps PyTorch's default init, as in SANA.
#
# Every conditioning arm is OFF: the only variable vs the baseline is the FFN.
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-ffn-glumbconv
  model: vmamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4
  # -- conditioning arms: all OFF (adaLN-Zero baseline scaffold) --
  in_context_len: 0                 # in-context prefix OFF
  state_init: none                  # state-init OFF
  ssc: none                         # SSC OFF
  adaln_cond: full                  # adaLN-Zero on both branches (baseline)
  # -- FFN variant (orthogonal to the arms) --
  ffn: glumbconv               # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-ffn-glumbconv
