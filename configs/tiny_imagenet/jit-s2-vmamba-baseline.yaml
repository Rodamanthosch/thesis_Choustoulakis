# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 — adaLN-Zero BASELINE
# ------------------------------------------------------------
# The reference model every arm is compared against: SwiGLU FFN,
# mlp_ratio 4.0, every conditioning arm OFF. 31.03M params.
#
# mlp_ratio is applied BEFORE SwiGLU's 2/3 parameter-matching rule, so the
# FFN hidden width is h = int(mlp_ratio * D * 2/3):
#   mlp_ratio 3.0 -> h =  768 (effective 2.0)   27.49M
#   mlp_ratio 4.0 -> h = 1024 (effective 2.67)  31.03M   <- this file
#   mlp_ratio 4.5 -> h = 1152 (effective 3.0)   32.80M
# The FFN-width ablation notebook edits mlp_ratio in the cloned copy of
# this file, so training and evaluation build the same model.
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-baseline
  model: vmamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4
  # -- conditioning arms: all OFF (adaLN-Zero baseline scaffold) --
  in_context_len: 0                 # in-context prefix OFF
  state_init: none                  # state-init OFF
  ssc: none                         # SSC OFF
  adaln_cond: full                  # adaLN-Zero on both branches (baseline)
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-baseline
