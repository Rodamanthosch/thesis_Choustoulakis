# ============================================================
# JiT-S2-Spatial-Mamba on Tiny-ImageNet 64x64 -- GATED
# ------------------------------------------------------------
# JiT scaffold (adaLN-Zero, RMSNorm, SwiGLU) with Spatial-Mamba's
# Structure-aware SSM mixer (Xiao et al., ICLR 2025): ONE row-major scan,
# hidden states fused over the 2-D grid by dilated depthwise convs (SASF),
# then y = C h + D u. Gate branch on: LN(y) * SiLU(z), as in the paper.
# LPU (zero-init) before the mixer and the FFN, as in the Spatial-Mamba block.
# adaLN-Zero baseline conditioning only (no in-context / state-init / SSC).
#
#   mixer per block (D=384): 477,699  + LPU 7,680
#   model: 31.45M params
# SS2D counterpart: jit-s2-vmamba-dstate1.yaml (30.20M).
# ============================================================

experiment:
  name: jit-s2-spatial-tinyin-gate
  model: spatial_mamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # Spatial-Mamba (and VMamba-T) setting; required
  d_conv: 3
  expand: 1                         # param-matched to VMamba-T (paper uses 2)
  gate: true                        # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 2, 3]         # SASF on the 8x8 grid; paper [1, 3, 5] for 16x16 (256px)
  lpu: zero                         # Local Perception Units before mixer & FFN: none | zero | paper
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-spatial-gate
