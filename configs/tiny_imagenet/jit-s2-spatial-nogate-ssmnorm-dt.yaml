# ============================================================
# JiT-S2-Spatial-Mamba (no gate, d_state 1) on Tiny-ImageNet 64x64 — Jamba's dt norm
# ------------------------------------------------------------
# jit-s2-spatial-nogate.yaml with Jamba's RMSNorm on the low-rank dt input
# (Lieber et al., arXiv 2403.19887, Sec. 6.4; transformers' JambaMambaMixer
# dt_layernorm), right after x_proj's split and BEFORE dt_proj:
#   dt_r <- g_dt * RMSNorm(dt_r)   dt_rank = 24 wide, learnable gain init 1
# Jamba also normalises B and C, but at d_state 1 they are one scalar per
# token and an RMSNorm over one value is just its sign, so they are left
# alone: this is "Jamba's dt norm only", not the full QK-norm analogue
# (that run is jit-s2-vmamba-ssmnorm-bcdt.yaml, d_state 16).
#
# +288 params (12 blocks x 24) -> 29,686,404. Every other weight equals the
# no-gate run's at the same seed; adaLN-Zero only, so the dt norm is the only
# variable vs jit-s2-spatial-nogate.yaml.
# ============================================================

experiment:
  name: jit-s2-spatial-tinyin-nogate-ssmnorm-dt
  model: spatial_mamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # Spatial-Mamba (and VMamba-T) setting; required
  d_conv: 3
  expand: 1                         # param-matched to VMamba-T (paper uses 2)
  gate: false                       # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 2, 3]         # SASF on the 8x8 grid; paper [1, 3, 5] for 16x16 (256px)
  lpu: zero                         # Local Perception Units before mixer & FFN: none | zero | paper
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv
  # -- Jamba's RMSNorm on the SSM parameters: dt_r only at d_state 1 --
  ssm_norm: dt                 # none | dt

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-spatial-nogate-ssmnorm-dt
