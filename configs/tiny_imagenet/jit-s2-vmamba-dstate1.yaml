# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 -- d_state = 1
# ------------------------------------------------------------
# The published VMamba-T mixer (vmambav2v_tiny_224 / vssm1_tiny_0230s:
# ssm_ratio 1.0, d_state 1, no gate): the baseline with d_state 16 -> 1.
# Config-only change; same JiTVMamba code, every conditioning arm OFF.
# It is the SS2D counterpart of the JiT-S2-Spatial runs
# (jit-s2-spatial-{gate,nogate}.yaml): 4 scans + CrossMerge vs
# 1 scan + structure-aware state fusion.
#
#   SS2D mixer per block (D=384):  450,048 (d_state 16) -> 380,928
#   model: 31.03M -> 30.20M params
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-dstate1
  model: vmamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # published VMamba-T (vmambav2v_tiny) setting; baseline uses 16
  d_conv: 3
  expand: 1                         # VMamba-T ssm_ratio 1.0
  K: 4
  # -- conditioning arms: all OFF (adaLN-Zero baseline scaffold) --
  in_context_len: 0                 # in-context prefix OFF
  state_init: none                  # state-init OFF
  ssc: none                         # SSC OFF
  adaln_cond: full                  # adaLN-Zero on both branches (baseline)
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-dstate1
