# ============================================================
# JiT-S2-VMamba (SS2D) + SASF on Tiny-ImageNet 64x64 -- d_state 1
# ------------------------------------------------------------
# The VMamba d_state 1 run (jit-s2-vmamba-dstate1.yaml, FID-10K 96.86) with
# Spatial-Mamba's structure-aware state fusion added INSIDE each of SS2D's
# four scan directions (Spatial-Mamba Appendix F, "VMamba + SASF"): every
# direction's states are fused over the 8x8 grid with its own kernels before
# its C read-out, then the directions are merged as usual.
# Same VMamba block otherwise: expand 1, no gate, NO LPU, all arms off.
#
#   SS2D per block (D=384): 380,928 + SASF 41,484 (4 directions x 10,371)
#   model: 30.70M (30,699,984) params, ~1.26 GMACs
# Compare: VMamba d_state 1 (4 scans, no fusion) and Spatial no gate
# (1 scan + fusion + LPU).
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-sasf
  model: vmamba_sasf
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # published VMamba-T (vmambav2v_tiny) setting; baseline uses 16
  d_conv: 3
  expand: 1                         # VMamba-T ssm_ratio 1.0
  K: 4
  sasf_dilations: [1, 2, 3]         # SASF per direction on the 8x8 grid (paper: [1, 3, 5] at 16x16)
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-sasf
