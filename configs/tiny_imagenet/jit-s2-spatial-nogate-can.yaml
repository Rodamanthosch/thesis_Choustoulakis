# ============================================================
# JiT-S2-Spatial-Mamba on Tiny-ImageNet 64x64 -- NO GATE + CAN CONDITIONAL KERNELS
# ------------------------------------------------------------
# jit-s2-spatial-nogate.yaml (FID 93.95) with the mixer DWConv 3x3 and the
# SASF kernels made condition-aware, after CAN (Cai et al., CVPR 2024, arXiv
# 2404.01143), whose Table 1 found the depthwise convs the most useful layers
# to condition (UViT-S/2 FID 28.32 -> 11.18).
#
# Our adaptation (CAN's code was never released; the generator is not
# specified): one generator per site, SHARED by all 12 blocks (CAN's device
# for its output projections; CAN gives each DW conv its own generator):
#   dK_dw   = W_dw   SiLU(c)  -> (d_inner, 3, 3)      W_dw:   9*384 x 384
#   dK_sasf = W_sasf SiLU(c)  -> (3, d_inner, 3, 3)   W_sasf: 27*384 x 384
# c = t + y (the adaLN vector), no bias, W zero-init (so at init this IS the
# no-gate model, weight for weight at seed 42). Block l convolves sample b with
# K_l + dK(c_b), in fp32; DWConv bias and SASF alpha unchanged. adaLN-Zero
# stays. Plain no-gate setup otherwise (no tokens / RoPE / ssm_norm / Derf).
#
#   model: 34,994,532 params (29,686,116 + 5,308,416 = 9*D^2 + 27*D^2)
#   MACs:  +0.0053 G (the two generators, once per forward)
# Eval ablation on the same checkpoint: evaluate.py --can_zero dwconv|sasf.
# ============================================================

experiment:
  name: jit-s2-spatial-tinyin-nogate-can
  model: spatial_mamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # Spatial-Mamba (and VMamba-T) setting; required
  d_conv: 3
  expand: 1                         # param-matched to VMamba-T (paper uses 2)
  gate: false                       # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 2, 3]         # SASF on the 8x8 grid; paper [1, 3, 5] for 16x16 (256px)
  lpu: zero                         # Local Perception Units before mixer & FFN: none | zero | paper
  # -- CAN conditional kernels (shared generator per site) --
  dwconv_can: true                  # mixer DWConv 3x3: K_l + W_dw SiLU(c)
  sasf_can: true                    # SASF kernels:     K_l + W_sasf SiLU(c)
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-spatial-nogate-can
