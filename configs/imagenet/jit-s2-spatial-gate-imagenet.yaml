# ============================================================
# JiT-S2-Spatial-Mamba on ImageNet 256x256 -- GATED, adaLN only
# ImageNet counterpart of configs/tiny_imagenet/jit-s2-spatial-gate.yaml:
# same block (1 row-major scan + SASF, gate LN(y)*SiLU(z), LPU zero, expand 1),
# but 16x16 tokens, so SASF uses the paper's dilations [1, 3, 5].
#   model: 32.13M (32,132,004) params; Tiny-IN version 31.46M (+676,416 = patch-16 embed + head)
# ============================================================

experiment:
  name: jit-s2-spatial-imagenet-gate
  model: spatial_mamba
  dataset: imagenet
  data_dir: /path/to/imagenet        # overridden by the launcher (folder with train/ + val/)
  seed: 42

model:
  input_size: 256
  patch_size: 16                     # 256/16 = 16x16 = 256 tokens (same as the other ImageNet configs)
  in_channels: 3
  hidden_size: 384                   # S scale
  depth: 12
  num_heads: 6                       # attention-parity arg; unused
  mlp_ratio: 4.0                     # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 1000
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                         # Spatial-Mamba setting; required
  d_conv: 3
  expand: 1                          # param-matched to VMamba-T (paper uses 2)
  gate: true                         # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 3, 5]          # paper's setting for the 16x16 grid (Tiny-IN 8x8 uses [1, 2, 3])
  lpu: zero                          # Local Perception Units before mixer & FFN: none | zero | paper
  ffn: swiglu                        # swiglu | convglu | glumbconv
training:
  epochs: 100                        # JiT paper uses 600; 100 matches your other runs. Override via arg.
  batch_size: 1024                   # TOTAL across GPUs -> 128/GPU on 8 (run_experiment divides by world_size)
  warmup_epochs: 5
  blr: 5.0e-5                        # lr = blr * total_batch/256 = 2e-4 (JiT ImageNet lr)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0                   # paper: 1.0 * image_size/256 = 1.0 at 256

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5                     # sweep [1.0, 4.0] at eval
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50
  amp: true                        # bf16 autocast sampling, as JiT engine_jit.py evaluate()

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/imagenet/jit-s2-spatial-gate
