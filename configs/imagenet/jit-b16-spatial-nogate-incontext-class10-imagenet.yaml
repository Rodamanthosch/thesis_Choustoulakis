# ============================================================
# JiT-B/16-Spatial-Mamba on ImageNet 256x256 -- NO GATE + 10 IN-CONTEXT CLASS TOKENS
# ------------------------------------------------------------
# jit-b16-spatial-nogate-imagenet.yaml (same recipe) plus 10 class tokens
# placed INSIDE the one row-major scan, each just before grid cell (row, col);
# placement as jit-s2-spatial-nogate-incontext-class10-imagenet.yaml.
# The 10 cells minimise the worst-case distance first, then the mean, on the
# 16x16 grid (local search over every cell, 150 restarts x 3 seeds); they are
# the best 8-token set (0,0) (0,11) (6,9) (7,7) (7,15) (8,15) (15,0) (15,11)
# plus (9,8) and (15,12). Scan steps from the nearest class token, per layer,
# with SASF dilations [1, 3, 5] (max / mean over the 256 image tokens):
#   1 head prefix token              171 / 59.44
#   3 tokens (0,5),(9,15),(10,15)     12 /  3.15
#   5 tokens                           6 /  1.78
#   8 tokens (the set above)           3 /  1.24
#   this: 10 tokens                    2 /  1.13   (Tiny-IN class3 run: 2 / 1.19)
#   16 tokens (best)                   1 /  1.00
# Scan length 256 -> 266 (+3.9%) in blocks 4-11, about +2.5% MACs overall.
#
# Same persist & update scheme as the VMamba in-context arm: tokens
# [y_emb + slot] prepended once at block 4 (JiT-B/16's in_context_start; JiT
# uses depth/3: L 8, H 10), updated by blocks 4-11, stripped before the final
# layer. adaLN-Zero stays on. The tokens skip the mixer's DWConv, get only the
# centre tap of the LPU and are not fused by SASF (grid states only).
#
#   model: 118,583,844 params (+7,680 = 10 x 768 slots), 19.24 GMACs (no tokens: 118,576,164 / 18.76, +2.6%)
#   src/flops_counter.py via evaluate.py::build_model
# ============================================================

experiment:
  name: jit-b16-spatial-imagenet-nogate-incontext-class10
  model: spatial_mamba
  dataset: imagenet
  data_dir: /path/to/imagenet        # overridden by the launcher (folder with train/ + val/)
  seed: 42

model:
  input_size: 256
  patch_size: 16                     # 256/16 = 16x16 = 256 tokens (JiT-B/16). SAME for all variants.
  in_channels: 3
  hidden_size: 768                   # B scale
  depth: 12
  num_heads: 12                      # attention-parity arg; unused
  mlp_ratio: 4.0                     # FFN width: h = int(mlp_ratio * D * 2/3) = 2048
  bottleneck_dim: 128
  num_classes: 1000
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                         # Spatial-Mamba setting; required
  d_conv: 3
  expand: 1                          # as B/16-VMamba (expand 1)
  gate: false                        # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 3, 5]          # paper's setting for the 16x16 grid
  lpu: zero                          # Local Perception Units before mixer & FFN: none | zero | paper
  # -- in-context class tokens --
  in_context_len: 10                # one token per position below
  in_context_start: 4                # prepended at block 4 (blocks 0-3 pure grid) = JiT-B's start (depth/3)
  in_context_content: class          # only class is ported to spatial_mamba
  in_context_positions: [[0, 0], [0, 11], [6, 9], [7, 7], [7, 15], [8, 15], [9, 8], [15, 0], [15, 11], [15, 12]]   # [row, col]: scanned just before that cell
  ffn: swiglu                        # swiglu | convglu | glumbconv

training:
  epochs: 600                        # JiT paper / README (B/16 at 256); the launchers override it (default 100)
  batch_size: 1024                   # EFFECTIVE total: micro-batch = 1024 / (world_size * accum_iter)
  accum_iter: 4                      # 1 GPU: 4 x 256 = 1024; on 4+ GPUs set ACCUM=1 in the launcher
  warmup_epochs: 5
  blr: 5.0e-5                        # lr = blr * total_batch/256 = 2e-4 (JiT ImageNet lr)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05                        # paper Table 9 (clip of 1-t)
  noise_scale: 1.0                   # paper: 1.0 * image_size/256 = 1.0 at 256

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5                     # sweep at eval
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50
  amp: true                        # bf16 autocast sampling, as JiT engine_jit.py evaluate()
  n_samples: 50000                 # FID-50K / IS-50K (50 per class), the JiT protocol; --n_samples overrides

checkpoint:
  save_last_freq: 1                  # overwrite checkpoint-last.pt every epoch (resume point)
  save_archive_freq: 50              # keep checkpoint-ep050.pt, -ep100.pt, ... -ep600.pt permanently
  resume_from: null
  output_dir: experiments/imagenet/jit-b16-spatial-nogate-incontext-class10
