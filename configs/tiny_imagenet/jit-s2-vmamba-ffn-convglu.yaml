# ============================================================
# JiT-S2-VMamba (SS2D) on Tiny-ImageNet 64x64 — ConvGLU FFN (TransNeXt)
# ------------------------------------------------------------
# adaLN-Zero baseline scaffold with the token-wise SwiGLU FFN swapped for
# TransNeXt's Convolutional GLU (Shi, CVPR 2024), GELU -> SiLU:
#   [g, v] = W1 u + b1
#   y      = W2( SiLU(DWConv3x3(g)) * v ) + b2
# i.e. SwiGLU with a depthwise 3x3 conv over the 8x8 token grid on the GATE
# half, before its SiLU. Each token's gate sees its 3x3 neighbourhood, adding
# local 2-D mixing next to SS2D's 1-D scans.
#
# Width param-matched to SwiGLU: h = int(mlp_ratio * D * 2/3) = 1024 (the
# same 2/3 rule TransNeXt applies). +10,240 params/block (+0.9% FFN),
# +0.12M total. DWConv init as TransNeXt: N(0, sqrt(2/9)), zero bias.
#
# Every conditioning arm is OFF: the only variable vs the baseline is the FFN.
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-ffn-convglu
  model: vmamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4
  # -- conditioning arms: all OFF (adaLN-Zero baseline scaffold) --
  in_context_len: 0                 # in-context prefix OFF
  state_init: none                  # state-init OFF
  ssc: none                         # SSC OFF
  adaln_cond: full                  # adaLN-Zero on both branches (baseline)
  # -- FFN variant (orthogonal to the arms) --
  ffn: convglu                 # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-ffn-convglu
