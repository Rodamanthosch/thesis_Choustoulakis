# ============================================================
# JiT-S2-VMamba2 (SS2D with a Mamba-2 / SSD core) on Tiny-ImageNet 64x64
# ------------------------------------------------------------
# The adaLN-Zero baseline (jit-s2-vmamba-baseline.yaml) with ONE change: the
# SS2D's Mamba-1 selective scan is replaced by Mamba-2 (SSD), following
# VMamba's own Mamba-2 variant (SS2Dm0, forward_type "m0_noz"):
#   - 24 heads x headdim 16 per direction (R = ceil(D/16), VMamba m0);
#     Delta and A one per HEAD (Mamba-1: Delta per channel, A per channel x state)
#   - d_state 16: same total state as the baseline (24 x 16 x 16 = 384 x 16)
#   - Mamba-2 module init (A ~ U[1,16], Delta log-uniform [1e-3, 1e-1]);
#     D per channel as in the baseline
#   - kernel: mamba_ssm's Triton mamba_chunk_scan_combined (mamba-ssm 2.2.4)
#
# Params: 30,278,208 (30.28M) vs the Mamba-1 baseline 31,031,616: mixer
#   450,048 -> 387,264 per block (no low-rank dt_proj, no per-channel A).
# Run scripts/check_vmamba2_cuda.py first on a new GPU type: it reports whether
# the Triton kernel works there in bf16, and in fp32 (force_fp32: true) if not.
# ============================================================

experiment:
  name: jit-s2-vmamba2-tinyin
  model: vmamba2
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6                      # attention-parity arg; unused
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4
  # -- Mamba-2 core --
  nheads: null                      # per direction; null -> ceil(384/16) = 24 (headdim 16)
  chunk_size: 64                    # VMamba m0; L = 64 is a single chunk
  force_fp32: false                 # true -> kernel inputs in fp32 (if bf16 Triton fails, e.g. T4)
  # -- FFN variant --
  ffn: swiglu                       # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba2
