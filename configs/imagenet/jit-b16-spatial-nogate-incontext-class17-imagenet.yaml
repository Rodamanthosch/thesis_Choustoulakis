# ============================================================
# JiT-B/16-Spatial-Mamba on ImageNet 256x256 -- NO GATE + 17 IN-CONTEXT CLASS TOKENS
# ------------------------------------------------------------
# jit-b16-spatial-nogate-imagenet.yaml (same recipe) plus 17 class tokens
# placed INSIDE the one row-major scan: one just before cell (0, 0) and one
# just before the centre cell (r, 8) of every row r. Successor of the class10
# run, whose cells were chosen for SASF reach and sit far apart in the scan.
#   - (r, 8): one token every 16 cells (Mamba-R, arXiv 2405.14858, spaces its
#     registers evenly in the 1-D sequence). The centre column lets SASF
#     (dilations up to 5) reach columns 3-13 on both sides; column 0 reaches
#     only 0-5.
#   - (0, 0): without it the cells (0, 0)-(0, 7) have no token before them in
#     the scan. It reads nothing but is read by all 256 cells (DiM's class
#     prefix position).
#   - No token after the last cell: with one forward scan no cell would read
#     it, so it could never affect the output.
# Scan steps from the nearest preceding class token, per layer (max / mean
# over the 256 image tokens), scan only | with SASF dilations [1, 3, 5]:
#   1 head prefix token          256 / 128.50  |  171 / 59.44
#   class10 (SASF-optimal)        94 /  34.55  |    2 /  1.13
#   16: before (r, 0)             16 /   8.50  |   11 /  4.44
#   16: before (r, 8)             16 /   8.37* |    9 /  2.94   (* 8 cells with no token before)
#   this: (0, 0) + (r, 8), 17     16 /   8.25  |    9 /  2.35
#   32: before (r, 0), (r, 8)      8 /   4.50  |    3 /  1.38   (class32 config)
# Scan length 256 -> 273 (+6.6%) in blocks 4-11.
#
# Same persist & update scheme as the VMamba in-context arm: tokens
# [y_emb + slot] prepended once at block 4 (JiT-B/16's in_context_start; JiT
# uses depth/3: L 8, H 10), updated by blocks 4-11, stripped before the final
# layer. adaLN-Zero stays on. The tokens skip the mixer's DWConv, get only the
# centre tap of the LPU and are not fused by SASF (grid states only).
#
#   model: 118,589,220 params (+13,056 = 17 x 768 slots)
#   GMACs not counted here (no fvcore locally): ~19.6 by linear extrapolation
#   of class10 (+0.048 G per token); evaluate.py prints the exact count.
# ============================================================

experiment:
  name: jit-b16-spatial-imagenet-nogate-incontext-class17
  model: spatial_mamba
  dataset: imagenet
  data_dir: /path/to/imagenet        # overridden by the launcher (folder with train/ + val/)
  seed: 42

model:
  input_size: 256
  patch_size: 16                     # 256/16 = 16x16 = 256 tokens (JiT-B/16). SAME for all variants.
  in_channels: 3
  hidden_size: 768                   # B scale
  depth: 12
  num_heads: 12                      # attention-parity arg; unused
  mlp_ratio: 4.0                     # FFN width: h = int(mlp_ratio * D * 2/3) = 2048
  bottleneck_dim: 128
  num_classes: 1000
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                         # Spatial-Mamba setting; required
  d_conv: 3
  expand: 1                          # as B/16-VMamba (expand 1)
  gate: false                        # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 3, 5]          # paper's setting for the 16x16 grid
  lpu: zero                          # Local Perception Units before mixer & FFN: none | zero | paper
  # -- in-context class tokens --
  in_context_len: 17                 # one token per position below
  in_context_start: 4                # prepended at block 4 (blocks 0-3 pure grid) = JiT-B's start (depth/3)
  in_context_content: class          # only class is ported to spatial_mamba
  in_context_positions: [[0, 0], [0, 8], [1, 8], [2, 8], [3, 8], [4, 8], [5, 8], [6, 8], [7, 8], [8, 8], [9, 8], [10, 8], [11, 8], [12, 8], [13, 8], [14, 8], [15, 8]]   # [row, col]: scanned just before that cell
  ffn: swiglu                        # swiglu | convglu | glumbconv

training:
  epochs: 600                        # JiT paper / README (B/16 at 256); the launchers override it (default 100)
  batch_size: 1024                   # EFFECTIVE total: micro-batch = 1024 / (world_size * accum_iter)
  accum_iter: 4                      # 1 GPU: 4 x 256 = 1024; on 4+ GPUs set ACCUM=1 in the launcher
  warmup_epochs: 5
  blr: 5.0e-5                        # lr = blr * total_batch/256 = 2e-4 (JiT ImageNet lr)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05                        # paper Table 9 (clip of 1-t)
  noise_scale: 1.0                   # paper: 1.0 * image_size/256 = 1.0 at 256

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5                     # sweep at eval
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50
  amp: true                        # bf16 autocast sampling, as JiT engine_jit.py evaluate()
  n_samples: 50000                 # FID-50K / IS-50K (50 per class), the JiT protocol; --n_samples overrides

checkpoint:
  save_last_freq: 1                  # overwrite checkpoint-last.pt every epoch (resume point)
  save_archive_freq: 50              # keep checkpoint-ep050.pt, -ep100.pt, ... -ep600.pt permanently
  resume_from: null
  output_dir: experiments/imagenet/jit-b16-spatial-nogate-incontext-class17
