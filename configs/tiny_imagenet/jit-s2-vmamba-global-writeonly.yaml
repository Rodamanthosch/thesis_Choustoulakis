# ============================================================
# JiT-S2-VMamba-Global (model: vmamba_global) on Tiny-ImageNet 64x64 -- writeonly
# ------------------------------------------------------------
# src/models/vmamba_global.py. M = 16 class tokens (y_emb + learned slot), joined
# at block 4, carried through blocks 4-11, stripped before the final layer, as
# the in-context prefix -- but NEVER inserted into the scan. Per block and
# direction they write a memory S_k = mean_m (Delta u)^e B^e^T and the image
# reads it undecayed (scan + alpha_xe * S_k C_t); the tokens read
# alpha_ee S_k + alpha_ex G_k, G_k = mean_s (Delta u)_s B_s^T.
#   this file: write only: no G, so the tokens read S only (no alpha_ex)
# Gains alpha_* (384,), ones-init, no decay; block 11 holds alpha_xe only (its
# token rows are stripped right after it). Params 31,043,520; fvcore
# ~1.646 GMACs (estimate; baseline 1.423).
# The baseline's other knobs are unchanged; every vmamba.py arm stays off
# (asserted by JiTVMambaGlobal).
# ============================================================

experiment:
  name: jit-s2-vmamba-tinyin-global-writeonly
  model: vmamba_global
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4
  # -- global condition tokens (vmamba_global) --
  global_len: 16                    # M class tokens
  global_start: 4                   # tokens join at block 4 (blocks 0-3 pure grid)
  global_readback: false             # true: tokens also read the image memory G
  global_kernel_xe: linear           # linear | softmax  (image <- token term)
  # -- FFN variant (orthogonal) --
  ffn: swiglu

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-vmamba-global-writeonly
