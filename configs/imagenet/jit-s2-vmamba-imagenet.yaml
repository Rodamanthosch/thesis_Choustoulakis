# ============================================================
# JiT-S2-VMamba on ImageNet 256x256 -- BASELINE ("γραμμικό", adaLN only)
# Aligned with scripts/run_experiment.py (NOT the old src.train schema).
# Single node, 8x GPU via torchrun. data_dir/output_dir come from run_imagenet.sh.
# ============================================================

experiment:
  name: jit-vmamba-imagenet-baseline
  model: vmamba                       # jit | vim | vmamba
  dataset: imagenet
  data_dir: /path/to/imagenet        # overridden by run_imagenet.sh (folder with train/ + val/)
  seed: 42

model:

  input_size: 256
  patch_size: 16                     # 256/16 = 16x16 = 256 tokens
  in_channels: 3
  hidden_size: 384                   # S scale
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  bottleneck_dim: 128
  num_classes: 1000                  # set to your dataset's #classes (e.g. 100 for ImageNet-mini)
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4

training:
  epochs: 100                        # JiT paper uses 600; 100 matches your other runs. Override via arg.
  batch_size: 1024                   # TOTAL across GPUs -> 128/GPU on 8 (run_experiment divides by world_size)
  warmup_epochs: 5
  blr: 5.0e-5                        # lr = blr * total_batch/256 = 2e-4 (JiT ImageNet lr)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0                   # !! VERIFY for 256x256: JiT scales noise with resolution (Table 9).
                                     #    Fine for a smoke test; check before the full run.

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5                     # sweep [1.0, 4.0] at eval
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/imagenet/jit-vmamba-baseline
