# ============================================================
# JiT-S2-Spatial-Mamba on Tiny-ImageNet 64x64 -- NO GATE + 3 IN-CONTEXT CLASS TOKENS
# ------------------------------------------------------------
# jit-s2-spatial-nogate.yaml (FID 93.95) plus 3 class tokens placed INSIDE
# the one row-major scan, each just before grid cell (row, col):
#   (0, 3), (3, 3), (7, 3)
# SASF reads states up to 3 rows / columns away (dilations [1, 2, 3]), so the
# cells LEFT of a token get it through the fused state just after it, and the
# rows between tokens through the vertical taps. Scan steps from the nearest
# class token, per layer (max / mean over the 64 image tokens):
#   1 head prefix token, no SASF       64 / 32.5
#   1 head prefix token, with SASF     37 / 12.25
#   VMamba 4 scans, 1 prefix token     29 / 11.5   (FID 89.20 with class m=1)
#   this: 3 tokens at (0,3),(3,3),(7,3)  2 / 1.19   (best of every 3-row choice)
# (tests/test_spatial_incontext_cpu.py check G recomputes the last two rows
#  from the model's own scan order.)
# Scan length 64 -> 67 (+4.7%).
#
# Same persist & update scheme as the VMamba in-context arm: tokens
# [y_emb + slot] prepended once at block 4, updated by blocks 4-11, stripped
# before the final layer. adaLN-Zero stays on. The tokens skip the mixer's
# DWConv and get only the centre tap of the LPU (they have no grid cell).
#
#   model: 29.69M params (+1,152 = 3 x 384 learnable slots)
# ============================================================

experiment:
  name: jit-s2-spatial-tinyin-nogate-incontext-class3
  model: spatial_mamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # Spatial-Mamba (and VMamba-T) setting
  d_conv: 3
  expand: 1                         # param-matched to VMamba-T (paper uses 2)
  gate: false                       # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 2, 3]         # SASF on the 8x8 grid; paper [1, 3, 5] for 16x16 (256px)
  lpu: zero                         # Local Perception Units before mixer & FFN: none | zero | paper
  # -- in-context class tokens --
  in_context_len: 3                 # one token per position below
  in_context_start: 4               # prepended at block 4 (blocks 0-3 pure grid), as VMamba's arm
  in_context_content: class         # only class is ported to spatial_mamba
  in_context_positions: [[0, 3], [3, 3], [7, 3]]   # [row, col]: scanned just before that cell
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-spatial-nogate-incontext-class3
