# ============================================================
# JiT-S2-VMamba (SS2D) + SASF on ImageNet 256x256 -- d_state 1, adaLN only
# ImageNet counterpart of configs/tiny_imagenet/jit-s2-vmamba-sasf.yaml:
# Spatial-Mamba's state fusion inside each of SS2D's 4 scan directions
# (Spatial-Mamba App. F), on the 16x16 grid with the paper's dilations [1, 3, 5].
#   model: 31.38M (31,376,400) params; Tiny-IN version 30,699,984 (+676,416 = patch-16 embed + head)
# ============================================================

experiment:
  name: jit-s2-vmamba-imagenet-sasf
  model: vmamba_sasf
  dataset: imagenet
  data_dir: /path/to/imagenet        # overridden by the launcher (folder with train/ + val/)
  seed: 42

model:
  input_size: 256
  patch_size: 16                     # 256/16 = 16x16 = 256 tokens (same as the other ImageNet configs)
  in_channels: 3
  hidden_size: 384                   # S scale
  depth: 12
  num_heads: 6                       # attention-parity arg; unused
  mlp_ratio: 4.0                     # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 1000
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                         # must be 1 (asserted)
  d_conv: 3
  expand: 1                          # VMamba-T ssm_ratio 1.0
  K: 4
  sasf_dilations: [1, 3, 5]          # paper's setting for the 16x16 grid (Tiny-IN 8x8 uses [1, 2, 3])
  ffn: swiglu                        # swiglu | convglu | glumbconv
training:
  epochs: 100                        # JiT paper uses 600; 100 matches your other runs. Override via arg.
  batch_size: 1024                   # TOTAL across GPUs -> 128/GPU on 8 (run_experiment divides by world_size)
  warmup_epochs: 5
  blr: 5.0e-5                        # lr = blr * total_batch/256 = 2e-4 (JiT ImageNet lr)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0                   # !! VERIFY for 256x256: JiT scales noise with resolution (Table 9).
                                     #    Fine for a smoke test; check before the full run.

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5                     # sweep [1.0, 4.0] at eval
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50
  amp: true                        # bf16 autocast sampling, as JiT engine_jit.py evaluate()

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/imagenet/jit-s2-vmamba-sasf
