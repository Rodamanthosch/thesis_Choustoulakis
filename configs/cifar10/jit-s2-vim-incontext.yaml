# ============================================================
# JiT-S2-ViM (BiMamba) on CIFAR-10 — OPTION A: in-context class tokens
# ------------------------------------------------------------
# Prefix-token conditioning. Plumbing follows DiS (feizc/DiS, bimamba_type="v2"):
# conditioning tokens are concatenated at the FRONT of the sequence, given
# learnable positional slots, scanned by BiMambaV2, and stripped after the final
# block. Default in_context_len=1 = DiS-exact single class token. The token slots
# carry a learned positional offset (JiT rk = e_y + p_k), so raising in_context_len
# recovers the JiT Table 9 multi-slot mechanism for a K-sweep (diffcond.pdf eq. 5:
# do K prepended tokens survive the scan's state compression, or collapse to one?).
#
# Sweep K without new files:
#   for K in 1 4 16 32; do
#     python scripts/run_experiment.py --config configs/cifar10/jit-s2-vim-incontext.yaml \
#       model.in_context_len=$K checkpoint.output_dir=experiments/cifar10/vim-incontext-K$K
#   done
#
# For the controlled A/B, mirror the SAME in_context_len in your JiT-S config
# (configs/cifar10/jit-s-baseline.yaml -> model.in_context_len, already at line 26).
# ============================================================

experiment:
  name: jit-s2-vim-cifar10-incontext
  model: vim            # jit | vim | vmamba
  dataset: cifar10
  seed: 42

model:
  mixer_impl: vim
  input_size: 32
  patch_size: 2
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6          # unused by vim, kept for parity
  mlp_ratio: 4.0
  bottleneck_dim: 128
  num_classes: 10
  attn_drop: 0.0
  proj_drop: 0.0
  # Mamba knobs
  d_state: 16
  d_conv: 4
  expand: 1             # paper-faithful Vim (NOT expand=2)
  # ── Option A: in-context class tokens ──
  in_context_len: 1     # DiS-style single class token (default); raise to sweep K=4,16,32
  in_context_start: 0   # block index to prepend at (DiS=0; JiT-B=4)
  # ── Option C: off here ──
  cond_init: none       # none | conv_state

training:
  epochs: 200
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.0
  cfg_scale: 1.0
  cfg_interval: [0.0, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/cifar10/jit-s2-vim-incontext
