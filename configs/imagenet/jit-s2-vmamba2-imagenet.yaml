# ============================================================
# JiT-S2-VMamba2 (SS2D with a Mamba-2 / SSD core) on ImageNet 256x256 -- adaLN only
# ImageNet counterpart of configs/tiny_imagenet/jit-s2-vmamba2.yaml: Delta and A
# per head (24 heads x headdim 16 per direction), d_state 16, Triton kernel
# mamba_chunk_scan_combined. L = 256 tokens -> 4 chunks of 64 (VMamba m0).
# force_fp32: false verified on ARIS A100 (scripts/check_vmamba2_cuda.py, 2026-10-15).
#   model: 30.95M (30,954,624) params; Tiny-IN version 30,278,208 (+676,416 = patch-16 embed + head)
# ============================================================

experiment:
  name: jit-s2-vmamba2-imagenet
  model: vmamba2
  dataset: imagenet
  data_dir: /path/to/imagenet        # overridden by the launcher (folder with train/ + val/)
  seed: 42

model:
  input_size: 256
  patch_size: 16                     # 256/16 = 16x16 = 256 tokens (same as the other ImageNet configs)
  in_channels: 3
  hidden_size: 384                   # S scale
  depth: 12
  num_heads: 6                       # attention-parity arg; unused
  mlp_ratio: 4.0                     # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 1000
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 16
  d_conv: 3
  expand: 1
  K: 4
  nheads: null                       # per direction; null -> ceil(384/16) = 24 (headdim 16)
  chunk_size: 64                     # VMamba m0; L = 256 -> 4 chunks
  force_fp32: false                  # bf16 Triton kernel works on A100
  ffn: swiglu                        # swiglu | convglu | glumbconv
training:
  epochs: 100                        # JiT paper uses 600; 100 matches your other runs. Override via arg.
  batch_size: 1024                   # TOTAL across GPUs -> 128/GPU on 8 (run_experiment divides by world_size)
  warmup_epochs: 5
  blr: 5.0e-5                        # lr = blr * total_batch/256 = 2e-4 (JiT ImageNet lr)
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0                   # !! VERIFY for 256x256: JiT scales noise with resolution (Table 9).
                                     #    Fine for a smoke test; check before the full run.

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5                     # sweep [1.0, 4.0] at eval
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50
  amp: true                        # bf16 autocast sampling, as JiT engine_jit.py evaluate()

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/imagenet/jit-s2-vmamba2
