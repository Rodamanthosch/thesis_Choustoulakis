# ============================================================
# JiT-S2-Spatial-Mamba on Tiny-ImageNet 64x64 -- NO GATE + AUX TOKENS, NO SWAP (control)
# ------------------------------------------------------------
# jit-s2-spatial-nogate.yaml (FID 93.95) plus two auxiliary tokens.
# Control for jit-s2-spatial-nogate-auxswap.yaml.
#
# SF-Mamba's auxiliary patch swapping (Yoshimura et al., ICML 2026, arXiv
# 2603.16423; sony/SF-Mamba HybridStage.forward), ported to the one row-major
# Spatial-Mamba scan. At block 4 two tokens join the sequence, both the MEAN of
# the 64 grid tokens (no parameters): a HEAD token scanned before cell (0, 0)
# and a TAIL token scanned after cell (7, 7). The tail's state has read the
# whole grid.
#   swap   (SF-Mamba): head <-> tail after blocks 4-10 (7 swaps), so the tail
#          summary is scanned FIRST in the next block and reaches every cell:
#          future -> past flow from one forward scan.
#   noswap (control, paper Table 3): the same tokens, never swapped.
# Both stripped after block 11. Deviations from SF-Mamba: the tokens get the
# mixer DWConv's centre tap + SiLU (no grid neighbours), their states are not
# fused by SASF, and they start at block 4 (as our in-context arms).
# Plain no-gate setup otherwise (no feature RoPE / ssm_norm / Derf).
#
#   model: 29,686,116 params (same as jit-s2-spatial-nogate: +0)
#   scan length 64 -> 66
# ============================================================

experiment:
  name: jit-s2-spatial-tinyin-nogate-auxnoswap
  model: spatial_mamba
  dataset: imagenet
  data_dir: ./data/tiny-imagenet-200
  seed: 42

model:
  input_size: 64
  patch_size: 8
  in_channels: 3
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0                    # FFN width: h = int(mlp_ratio * D * 2/3) = 1024
  bottleneck_dim: 128
  num_classes: 200
  attn_drop: 0.0
  proj_drop: 0.0
  d_state: 1                        # Spatial-Mamba (and VMamba-T) setting; required
  d_conv: 3
  expand: 1                         # param-matched to VMamba-T (paper uses 2)
  gate: false                       # true: LN(y)*SiLU(z) (paper Fig. 4) | false: no z branch
  sasf_dilations: [1, 2, 3]         # SASF on the 8x8 grid; paper [1, 3, 5] for 16x16 (256px)
  lpu: zero                         # Local Perception Units before mixer & FFN: none | zero | paper
  # -- SF-Mamba auxiliary tokens --
  aux_tokens: noswap                # none | swap | noswap (control)
  aux_tokens_start: 4               # tokens join at block 4 (blocks 0-3 pure grid)
  # -- FFN variant (orthogonal to the arms) --
  ffn: swiglu                  # swiglu | convglu | glumbconv

training:
  epochs: 100
  batch_size: 128
  warmup_epochs: 5
  blr: 5.0e-5
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996
  amp: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0

cfg:
  label_drop_prob: 0.1
  cfg_scale: 2.5
  cfg_interval: [0.1, 1.0]

sampling:
  method: heun
  steps: 50

checkpoint:
  save_last_freq: 5
  save_archive_freq: 25
  resume_from: null
  output_dir: experiments/tiny_imagenet/jit-s2-spatial-nogate-auxnoswap
